<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 510" width="720" height="510" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="720" height="510" fill="#f6f7f9"/>

  <text x="20" y="26" font-size="15" font-weight="600" fill="#1f2328">Postazione supina completa — trasduttori, luce e appoggi</text>

  <!-- soffitto -->
  <line x1="30" y1="58" x2="470" y2="58" stroke="#1f2328" stroke-width="1.6"/>
  <rect x="30" y="60" width="200" height="22" fill="#dfe6ef"/>
  <rect x="230" y="60" width="140" height="22" fill="#e9eef4"/>
  <rect x="370" y="60" width="100" height="22" fill="#f1f4f7"/>
  <text x="30" y="48" font-size="12" fill="#57606a">soffitto</text>

  <!-- raggi -->
  <g stroke="#8fb4d9" stroke-width="1" fill="none">
    <line x1="56" y1="218" x2="120" y2="62"/>
    <line x1="56" y1="218" x2="215" y2="62"/>
    <line x1="56" y1="218" x2="330" y2="62"/>
    <line x1="56" y1="218" x2="440" y2="64"/>
  </g>

  <!-- piantana -->
  <line x1="56" y1="394" x2="56" y2="218" stroke="#57606a" stroke-width="2.5"/>
  <rect x="40" y="386" width="32" height="8" rx="2" fill="#e6e9ec" stroke="#57606a" stroke-width="1"/>
  <rect x="46" y="210" width="20" height="10" rx="2" fill="#cfe0f5" stroke="#2f6ea8" stroke-width="1.2"/>

  <!-- pavimento -->
  <line x1="30" y1="394" x2="560" y2="394" stroke="#1f2328" stroke-width="1.6"/>
  <g stroke="#b8c0c8" stroke-width="1">
    <line x1="34" y1="404" x2="44" y2="394"/><line x1="64" y1="404" x2="74" y2="394"/>
    <line x1="94" y1="404" x2="104" y2="394"/><line x1="124" y1="404" x2="134" y2="394"/>
    <line x1="154" y1="404" x2="164" y2="394"/><line x1="184" y1="404" x2="194" y2="394"/>
    <line x1="214" y1="404" x2="224" y2="394"/><line x1="244" y1="404" x2="254" y2="394"/>
    <line x1="274" y1="404" x2="284" y2="394"/><line x1="304" y1="404" x2="314" y2="394"/>
    <line x1="334" y1="404" x2="344" y2="394"/><line x1="364" y1="404" x2="374" y2="394"/>
    <line x1="394" y1="404" x2="404" y2="394"/><line x1="424" y1="404" x2="434" y2="394"/>
    <line x1="454" y1="404" x2="464" y2="394"/><line x1="484" y1="404" x2="494" y2="394"/>
    <line x1="514" y1="404" x2="524" y2="394"/><line x1="544" y1="404" x2="554" y2="394"/>
  </g>

  <!-- gommapiuma -->
  <rect x="90" y="352" width="27" height="42" rx="3" fill="#f7e6c8" stroke="#a76a12" stroke-width="1.2"/>
  <rect x="355" y="352" width="27" height="42" rx="3" fill="#f7e6c8" stroke="#a76a12" stroke-width="1.2"/>

  <!-- trasduttori -->
  <rect x="123" y="352" width="44" height="19" rx="3" fill="#cfe9e5" stroke="#1f7a70" stroke-width="1.2"/>
  <rect x="250" y="352" width="44" height="19" rx="3" fill="#cfe9e5" stroke="#1f7a70" stroke-width="1.2"/>

  <!-- pannello e tappetino -->
  <rect x="85" y="344" width="305" height="8" fill="#e6e9ec" stroke="#57606a" stroke-width="1"/>
  <rect x="85" y="338" width="305" height="6" rx="2" fill="#cdd3d9"/>

  <!-- cuscino e rullo -->
  <rect x="88" y="328" width="40" height="10" rx="5" fill="#cdd3d9"/>
  <ellipse cx="322" cy="325" rx="27" ry="14" fill="#cdd3d9"/>

  <!-- persona -->
  <circle cx="108" cy="315" r="13" fill="#aab2ba"/>
  <path d="M122,328 C150,308 200,306 250,310 C268,312 278,316 288,322 L318,302 L352,332 L352,338 L288,338 C270,338 150,338 122,338 Z" fill="#aab2ba"/>

  <!-- vibrazione -->
  <path d="M139 348 q4-5 8 0 q4 5 8 0" fill="none" stroke="#1f7a70" stroke-width="1.2"/>
  <path d="M266 348 q4-5 8 0 q4 5 8 0" fill="none" stroke="#1f7a70" stroke-width="1.2"/>

  <!-- scatola -->
  <rect x="420" y="364" width="58" height="30" rx="4" fill="#e6e9ec" stroke="#57606a" stroke-width="1"/>
  <text x="449" y="383" font-size="12" fill="#57606a" text-anchor="middle">scatola</text>

  <!-- quota -->
  <line x1="149" y1="380" x2="268" y2="380" stroke="#57606a" stroke-width="1"/>
  <polygon points="145,380 151,377 151,383" fill="#57606a"/>
  <polygon points="272,380 266,377 266,383" fill="#57606a"/>
  <text x="208" y="375" font-size="12" fill="#57606a" text-anchor="middle">≈ 40 cm</text>

  <!-- leader -->
  <g stroke="#8a9199" stroke-width="0.8" stroke-dasharray="3 3" fill="none">
    <line x1="380" y1="72" x2="500" y2="96"/>
    <line x1="66" y1="215" x2="500" y2="152"/>
    <line x1="108" y1="330" x2="500" y2="208"/>
    <line x1="322" y1="312" x2="500" y2="264"/>
    <line x1="167" y1="362" x2="500" y2="320"/>
    <line x1="382" y1="374" x2="500" y2="372"/>
  </g>
  <text x="508" y="92" font-size="14" font-weight="600" fill="#2f6ea8">Luce indiretta</text>
  <text x="508" y="107" font-size="12" fill="#57606a">nessun LED negli occhi</text>
  <text x="508" y="148" font-size="14" font-weight="600" fill="#2f6ea8">Piantana LED</text>
  <text x="508" y="163" font-size="12" fill="#57606a">non tocca il pannello</text>
  <text x="508" y="204" font-size="14" font-weight="600" fill="#1f2328">Cuscino sottile</text>
  <text x="508" y="219" font-size="12" fill="#57606a">nuca, zona libera</text>
  <text x="508" y="260" font-size="14" font-weight="600" fill="#1f2328">Rullo</text>
  <text x="508" y="275" font-size="12" fill="#57606a">toglie il carico lombare</text>
  <text x="508" y="316" font-size="14" font-weight="600" fill="#1f7a70">Trasduttori</text>
  <text x="508" y="331" font-size="12" fill="#57606a">scapole e osso sacro</text>
  <text x="508" y="368" font-size="14" font-weight="600" fill="#a76a12">Gommapiuma</text>

  <!-- regole -->
  <rect x="20" y="422" width="680" height="72" rx="6" fill="#eceff2" stroke="#cdd3d9" stroke-width="1"/>
  <text x="34" y="444" font-size="14" font-weight="600" fill="#1f2328">Le due regole che tengono in piedi tutto</text>
  <text x="34" y="466" font-size="12" fill="#57606a">1 · Imbottisci solo nuca e ginocchia. Sopra scapole e sacro resta il tappetino sottile: sono i punti dei trasduttori.</text>
  <text x="34" y="486" font-size="12" fill="#57606a">2 · La piantana LED sta per terra da sola. Se fosse avvitata al pannello, a 40 Hz vibrerebbe e ronzerebbe.</text>
</svg>
