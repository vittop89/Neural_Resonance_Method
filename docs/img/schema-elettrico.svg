<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 680" width="720" height="680" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="720" height="680" fill="#f6f7f9"/>
  <text x="20" y="26" font-size="15" font-weight="600" fill="#1f2328">Schema elettrico — i quattro circuiti attorno all'ESP32</text>
  <text x="20" y="42" font-size="11" fill="#57606a">Resistenze e condensatori del kit passivi. Tutte le masse convergono in un unico nodo a stella.</text>

  <!-- =============== 1. RESPIRO =============== -->
  <rect x="20" y="56" width="330" height="264" rx="6" fill="#ffffff" stroke="#cdd3d9" stroke-width="1"/>
  <text x="36" y="78" font-size="13" font-weight="600" fill="#1f2328">1 · Respiro</text>
  <text x="36" y="94" font-size="11" fill="#57606a">partitore resistivo, il classico</text>

  <text x="52" y="118" font-size="11" font-weight="600" fill="#b3261e">3,3 V</text>
  <line x1="60" y1="124" x2="60" y2="144" stroke="#1f2328" stroke-width="1.3"/>
  <!-- FSR -->
  <rect x="46" y="144" width="28" height="46" fill="#ffffff" stroke="#1f2328" stroke-width="1.3"/>
  <line x1="40" y1="192" x2="80" y2="142" stroke="#1f2328" stroke-width="1.3"/>
  <polygon points="80,142 72,144 77,149" fill="#1f2328"/>
  <text x="88" y="162" font-size="11" font-weight="600" fill="#1f2328">FSR402</text>
  <text x="88" y="176" font-size="10" fill="#57606a">50–200 kΩ indossato</text>
  <line x1="60" y1="190" x2="60" y2="216" stroke="#1f2328" stroke-width="1.3"/>

  <!-- nodo -->
  <circle cx="60" cy="216" r="3.5" fill="#1f2328"/>
  <line x1="60" y1="216" x2="196" y2="216" stroke="#1f2328" stroke-width="1.3"/>
  <polygon points="200,216 194,213 194,219" fill="#1f2328"/>
  <text x="206" y="213" font-size="11" font-weight="600" fill="#2f6ea8">GPIO34</text>
  <text x="206" y="227" font-size="10" fill="#57606a">ADC1, solo ingresso</text>

  <!-- 10k verso massa -->
  <line x1="60" y1="216" x2="60" y2="242" stroke="#1f2328" stroke-width="1.3"/>
  <rect x="48" y="242" width="24" height="34" fill="#ffffff" stroke="#1f2328" stroke-width="1.3"/>
  <text x="82" y="264" font-size="11" fill="#1f2328">10 kΩ</text>
  <line x1="60" y1="276" x2="60" y2="290" stroke="#1f2328" stroke-width="1.3"/>
  <line x1="51" y1="290" x2="69" y2="290" stroke="#1f2328" stroke-width="1.6"/>
  <line x1="54" y1="294" x2="66" y2="294" stroke="#1f2328" stroke-width="1.4"/>
  <line x1="57" y1="298" x2="63" y2="298" stroke="#1f2328" stroke-width="1.2"/>

  <!-- 1uF -->
  <line x1="150" y1="216" x2="150" y2="252" stroke="#1f2328" stroke-width="1.3"/>
  <circle cx="150" cy="216" r="3.5" fill="#1f2328"/>
  <line x1="136" y1="252" x2="164" y2="252" stroke="#1f2328" stroke-width="1.6"/>
  <line x1="136" y1="259" x2="164" y2="259" stroke="#1f2328" stroke-width="1.6"/>
  <text x="172" y="259" font-size="11" fill="#1f2328">1 µF</text>
  <text x="172" y="273" font-size="10" fill="#57606a">taglio ~32 Hz</text>
  <line x1="150" y1="259" x2="150" y2="290" stroke="#1f2328" stroke-width="1.3"/>
  <line x1="141" y1="290" x2="159" y2="290" stroke="#1f2328" stroke-width="1.6"/>
  <line x1="144" y1="294" x2="156" y2="294" stroke="#1f2328" stroke-width="1.4"/>
  <line x1="147" y1="298" x2="153" y2="298" stroke="#1f2328" stroke-width="1.2"/>

  <!-- =============== 2. TATTO =============== -->
  <rect x="370" y="56" width="330" height="264" rx="6" fill="#ffffff" stroke="#1f7a70" stroke-width="1.4"/>
  <text x="386" y="78" font-size="13" font-weight="600" fill="#1f7a70">2 · Tatto — 40 Hz</text>
  <text x="386" y="94" font-size="11" fill="#57606a">il DAC esce già analogico: nessun filtro anti-portante</text>

  <text x="386" y="140" font-size="11" font-weight="600" fill="#1f7a70">GPIO25</text>
  <text x="386" y="153" font-size="10" fill="#57606a">DAC1</text>
  <line x1="432" y1="136" x2="456" y2="136" stroke="#1f2328" stroke-width="1.3"/>
  <rect x="456" y="124" width="34" height="24" fill="#ffffff" stroke="#1f2328" stroke-width="1.3"/>
  <text x="473" y="116" font-size="11" fill="#1f2328" text-anchor="middle">10 kΩ</text>
  <line x1="490" y1="136" x2="536" y2="136" stroke="#1f2328" stroke-width="1.3"/>
  <circle cx="536" cy="136" r="3.5" fill="#1f2328"/>

  <!-- 1.5k verso massa -->
  <line x1="536" y1="136" x2="536" y2="176" stroke="#1f2328" stroke-width="1.3"/>
  <rect x="524" y="176" width="24" height="34" fill="#ffffff" stroke="#1f2328" stroke-width="1.3"/>
  <text x="558" y="198" font-size="11" fill="#1f2328">1,5 kΩ</text>
  <line x1="536" y1="210" x2="536" y2="226" stroke="#1f2328" stroke-width="1.3"/>
  <line x1="527" y1="226" x2="545" y2="226" stroke="#1f2328" stroke-width="1.6"/>
  <line x1="530" y1="230" x2="542" y2="230" stroke="#1f2328" stroke-width="1.4"/>
  <line x1="533" y1="234" x2="539" y2="234" stroke="#1f2328" stroke-width="1.2"/>

  <!-- 4.7uF in serie -->
  <line x1="536" y1="136" x2="592" y2="136" stroke="#1f2328" stroke-width="1.3"/>
  <line x1="592" y1="122" x2="592" y2="150" stroke="#1f2328" stroke-width="1.6"/>
  <line x1="599" y1="122" x2="599" y2="150" stroke="#1f2328" stroke-width="1.6"/>
  <text x="596" y="114" font-size="11" fill="#1f2328" text-anchor="middle">4,7 µF</text>
  <line x1="599" y1="136" x2="648" y2="136" stroke="#1f2328" stroke-width="1.3"/>
  <polygon points="652,136 646,133 646,139" fill="#1f2328"/>
  <text x="620" y="164" font-size="11" font-weight="600" fill="#1f7a70" text-anchor="middle">IN L</text>
  <text x="620" y="177" font-size="10" fill="#57606a" text-anchor="middle">TPA3116</text>

  <rect x="386" y="250" width="298" height="56" rx="4" fill="#cfe9e5" stroke="#1f7a70" stroke-width="1"/>
  <text x="398" y="269" font-size="11" fill="#1f2328">Identico su <tspan font-weight="600">GPIO26 → IN R</tspan>. Il DAC oscilla attorno</text>
  <text x="398" y="285" font-size="11" fill="#1f2328">a metà scala: ~1,1 V picco-picco, che il partitore porta</text>
  <text x="398" y="301" font-size="11" fill="#1f2328">a <tspan font-weight="600">0,14 V efficaci</tspan>, dentro la finestra dell'amplificatore.</text>

  <!-- =============== 3. LUCE =============== -->
  <rect x="20" y="340" width="330" height="300" rx="6" fill="#ffffff" stroke="#2f6ea8" stroke-width="1.4"/>
  <text x="36" y="362" font-size="13" font-weight="600" fill="#2f6ea8">3 · Luce — un canale su tre</text>
  <text x="36" y="378" font-size="11" fill="#57606a">il buffer porta i 3,3 V a 5 V pieni sul gate</text>

  <text x="36" y="416" font-size="11" font-weight="600" fill="#2f6ea8">GPIO16</text>
  <line x1="86" y1="412" x2="112" y2="412" stroke="#1f2328" stroke-width="1.3"/>
  <rect x="112" y="392" width="86" height="40" rx="3" fill="#cfe0f5" stroke="#2f6ea8" stroke-width="1.3"/>
  <text x="155" y="410" font-size="11" font-weight="600" fill="#1f2328" text-anchor="middle">74HCT245</text>
  <text x="155" y="424" font-size="10" fill="#57606a" text-anchor="middle">A1 → B1</text>
  <line x1="198" y1="412" x2="226" y2="412" stroke="#1f2328" stroke-width="1.3"/>
  <text x="212" y="405" font-size="10" fill="#a76a12" text-anchor="middle">5 V</text>

  <rect x="226" y="386" width="86" height="52" rx="3" fill="#cfe0f5" stroke="#2f6ea8" stroke-width="1.3"/>
  <text x="269" y="404" font-size="11" font-weight="600" fill="#1f2328" text-anchor="middle">D4184</text>
  <text x="269" y="418" font-size="10" fill="#57606a" text-anchor="middle">SIG</text>
  <text x="269" y="431" font-size="10" fill="#57606a" text-anchor="middle">V+ · V−</text>

  <!-- strip -->
  <line x1="269" y1="386" x2="269" y2="360" stroke="#b3261e" stroke-width="1.4"/>
  <text x="278" y="358" font-size="10" font-weight="600" fill="#b3261e">+12 V</text>
  <line x1="269" y1="438" x2="269" y2="470" stroke="#1f2328" stroke-width="1.3"/>
  <rect x="196" y="470" width="146" height="34" rx="3" fill="#eceff2" stroke="#57606a" stroke-width="1"/>
  <text x="269" y="491" font-size="11" fill="#1f2328" text-anchor="middle">striscia RGB, filo R</text>

  <rect x="36" y="522" width="298" height="100" rx="4" fill="#cfe0f5" stroke="#2f6ea8" stroke-width="1"/>
  <text x="48" y="542" font-size="11" fill="#1f2328"><tspan font-weight="600">×3</tspan>: GPIO16→R, GPIO17→G, GPIO4→B.</text>
  <text x="48" y="560" font-size="11" fill="#1f2328">Sul 74HCT245: VCC e DIR a 5 V, OE a massa.</text>
  <text x="48" y="580" font-size="11" fill="#1f2328">Commutazione low-side: duty maggiore = più luce.</text>
  <text x="48" y="600" font-size="11" fill="#1f2328">Nessun diodo di ricircolo: il carico non è induttivo.</text>
  <text x="48" y="616" font-size="10" fill="#57606a">In disposizione ibrida i motorini invece lo richiedono.</text>

  <!-- =============== 4. SUONO =============== -->
  <rect x="370" y="340" width="330" height="300" rx="6" fill="#ffffff" stroke="#6b4fbb" stroke-width="1.4"/>
  <text x="386" y="362" font-size="13" font-weight="600" fill="#6b4fbb">4 · Suono</text>
  <text x="386" y="378" font-size="11" fill="#57606a">nessun chip sintetizzatore: arriva già il flusso audio</text>

  <text x="386" y="406" font-size="11" font-weight="600" fill="#6b4fbb">GPIO18</text>
  <text x="386" y="424" font-size="11" font-weight="600" fill="#6b4fbb">GPIO19</text>
  <text x="386" y="442" font-size="11" font-weight="600" fill="#6b4fbb">GPIO23</text>
  <text x="386" y="460" font-size="11" font-weight="600" fill="#b3261e">3,3 V</text>
  <line x1="440" y1="402" x2="472" y2="402" stroke="#1f2328" stroke-width="1.2"/>
  <line x1="440" y1="420" x2="472" y2="420" stroke="#1f2328" stroke-width="1.2"/>
  <line x1="440" y1="438" x2="472" y2="438" stroke="#1f2328" stroke-width="1.2"/>
  <line x1="440" y1="456" x2="472" y2="456" stroke="#1f2328" stroke-width="1.2"/>

  <rect x="472" y="386" width="106" height="86" rx="3" fill="#e2dcf7" stroke="#6b4fbb" stroke-width="1.3"/>
  <text x="525" y="404" font-size="11" font-weight="600" fill="#1f2328" text-anchor="middle">PCM5102A</text>
  <text x="481" y="422" font-size="10" fill="#57606a">BCK</text>
  <text x="481" y="440" font-size="10" fill="#57606a">LRCK</text>
  <text x="481" y="458" font-size="10" fill="#57606a">DIN · VIN</text>
  <line x1="578" y1="424" x2="608" y2="424" stroke="#1f2328" stroke-width="1.2"/>
  <polygon points="612,424 606,421 606,427" fill="#1f2328"/>
  <text x="616" y="421" font-size="11" font-weight="600" fill="#6b4fbb">LROUT</text>
  <text x="616" y="435" font-size="10" fill="#57606a">cuffie</text>

  <rect x="386" y="492" width="298" height="132" rx="4" fill="#e2dcf7" stroke="#6b4fbb" stroke-width="1"/>
  <text x="398" y="512" font-size="11" font-weight="600" fill="#1f2328">Ponticelli, da impostare PRIMA di alimentare</text>
  <text x="398" y="532" font-size="11" fill="#1f2328">SCK → LOW   nessun master clock: usa il PLL interno</text>
  <text x="398" y="550" font-size="11" fill="#1f2328">FLT → LOW   filtro a latenza normale</text>
  <text x="398" y="568" font-size="11" fill="#1f2328">DEMP → LOW  de-enfasi disattivata</text>
  <text x="398" y="586" font-size="11" font-weight="600" fill="#b3261e">XSMT → HIGH  se resta basso l'uscita è MUTATA</text>
  <text x="398" y="604" font-size="11" fill="#1f2328">FMT → LOW   formato I²S standard</text>
  <text x="398" y="620" font-size="10" fill="#57606a">È il primo posto da guardare se l'audio manca.</text>
</svg>
